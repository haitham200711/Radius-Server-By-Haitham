{{ define "auth_content" }}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand-icon mb-3">
                <i class="bi bi-router-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">تسجيل الدخول</h3>
            <p class="text-muted small">راديوس مايكروتك PRO - لوحة الإدارة السحابية</p>
        </div>

        {{ if .Error }}
        <div class="alert alert-danger py-2 small d-flex align-items-center gap-2 border-0 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ .Error }}</span>
        </div>
        {{ end }}

        <form method="POST" action="/auth/login">
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">اسم المستخدم:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="اسم المستخدم" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small text-secondary">كلمة المرور:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow">
                <i class="bi bi-box-arrow-in-left"></i>
                <span>تسجيل الدخول للنظام</span>
            </button>
        </form>

        <div class="text-center mt-4 border-top pt-3">
            <small class="text-muted">بيانات الدخول الافتراضية: <code>admin</code> / <code>admin123</code></small>
        </div>
    </div>
</div>
{{ end }}

{{ define "content" }}{{ end }}
{{ define "scripts" }}{{ end }}
